<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuration administrateur PAUME</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fa;
    }

    h1 {
      color: #0057b8;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #0057b8;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      display: none;
    }
  </style>
</head>

<body>

<h1>Création du compte administrateur PAUME</h1>

<form id="form">

  <label>Clé de configuration</label>
  <input id="setupKey" type="password" required>

  <label>Nom d'utilisateur</label>
  <input id="username" type="text" placeholder="admin" required>

  <label>Nom complet</label>
  <input id="full_name" type="text" placeholder="Administrateur PAUME" required>

  <label>Mot de passe</label>
  <input id="password" type="password" minlength="12" required>

  <label>Confirmer le mot de passe</label>
  <input id="confirm" type="password" minlength="12" required>

  <button type="submit">Créer le compte administrateur</button>

</form>

<div id="result"></div>

<script>
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  alert("Le bouton fonctionne. Le formulaire est bien détecté.");

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    alert("Les mots de passe ne correspondent pas.");
    return;
  }

  alert("Le formulaire est prêt à envoyer la demande.");
});
</script>
