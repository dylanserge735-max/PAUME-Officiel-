<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités | Administration PAUME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0057a8;
      color: white;
      padding: 18px 20px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    header h1 {
      margin-top: 12px;
      font-size: 23px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 14px 20px;
      background: #0057a8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #003b73;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #0057a8;
      text-decoration: none;
    }

    .info {
      margin-bottom: 20px;
      padding: 14px;
      background: #eef6ff;
      border-radius: 9px;
      color: #24506f;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <a href="tableau%20de%20bord.html">← Tableau de bord</a>
  <h1>📰 Gestion des actualités</h1>
</header>

<main>

  <div class="card">

    <div class="info">
      Créez ici une nouvelle actualité de PAUME.
      La publication automatique sera activée après connexion à la base de données.
    </div>

    <form id="newsForm">

      <div class="field">
        <label for="title">Titre de l'actualité</label>
        <input
          type="text"
          id="title"
          placeholder="Ex. PAUME participe à une journée de salubrité"
          required
        >
      </div>

      <div class="field">
        <label for="category">Domaine</label>

        <select id="category" required>
          <option value="">Choisir un domaine</option>
          <option value="Environnement">Environnement</option>
          <option value="Éducation">Éducation</option>
          <option value="Épanouissement">Épanouissement</option>
          <option value="Entraide">Entraide</option>
          <option value="Économie">Économie</option>
        </select>
      </div>

      <div class="field">
        <label for="date">Date de l'activité</label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label for="location">Lieu</label>
        <input
          type="text"
          id="location"
          placeholder="Ex. Grande Gare"
        >
      </div>

      <div class="field">
        <label for="content">Contenu</label>
        <textarea
          id="content"
          placeholder="Rédigez le contenu de l'actualité..."
          required
        ></textarea>
      </div>

      <button type="submit">
        💾 Enregistrer l'actualité
      </button>

    </form>

    <a class="back" href="tableau%20de%20bord.html">
      ← Retour au tableau de bord
    </a>

  </div>

</main>

<script>
  document.getElementById("newsForm").addEventListener("submit", function(e) {

    e.preventDefault();

    alert(
      "L'actualité est prête à être enregistrée. " +
      "La connexion à Neon sera ajoutée à l'étape suivante."
    );

  });
</script>

</body>
</html>
