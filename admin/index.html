<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — PAUME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0057a8, #003b73);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      color: #0057a8;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0057a8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #003b73;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      color: #d00000;
      display: none;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img src="../logo.jpg" alt="Logo PAUME" class="logo">

    <h1>Administration PAUME</h1>

    <p class="subtitle">
      Espace réservé à l'administration
    </p>

    <form id="loginForm">

      <label for="username">Identifiant</label>

      <input
        type="text"
        id="username"
        placeholder="Votre identifiant"
        autocomplete="username"
        required
      >

      <label for="password">Mot de passe</label>

      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Se connecter
      </button>

    </form>

    <p id="message"></p>

    <div class="footer">
      PAUME — Pour Avoir Un Meilleur Environnement
    </div>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document
        .getElementById("username")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      message.style.display = "none";
      message.textContent = "";

      if (!username || !password) {
        message.textContent =
          "Veuillez renseigner votre identifiant et votre mot de passe.";
        message.style.display = "block";
        return;
      }

      button.disabled = true;
      button.textContent = "Connexion...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.textContent =
            data.error || "Identifiants incorrects.";
          message.style.display = "block";
          return;
        }

        sessionStorage.setItem(
          "paume_admin_user",
          JSON.stringify(data.user)
        );

        window.location.href = "dashboard.html";

      } catch (error) {
        console.error("Erreur de connexion :", error);

        message.textContent =
          "Impossible de contacter le serveur.";
        message.style.display = "block";

      } finally {
        button.disabled = false;
        button.textContent = "Se connecter";
      }
    });
  </script>

</body>
</html>
