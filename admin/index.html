<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — PAUME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0057a8, #003b73);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      color: #0057a8;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0057a8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #003b73;
    }

    #message {
      margin-top: 15px;
      color: #d00000;
      display: none;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img src="../logo.jpg" alt="Logo PAUME" class="logo">

    <h1>Administration PAUME</h1>

    <p class="subtitle">
      Espace réservé à l'administration
    </p>

    <form id="loginForm">

      <label for="username">Identifiant</label>
      <input
        type="text"
        id="username"
        placeholder="Votre identifiant"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        required
      >

      <button type="submit">
        Se connecter
      </button>

    </form>

    <p id="message">
      Identifiant ou mot de passe incorrect.
    </p>

    <div class="footer">
      PAUME — Pour Avoir Un Meilleur Environnement
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {

      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      /*
       * ACCÈS TEMPORAIRE POUR LA CONSTRUCTION DU SITE
       * La vraie authentification sécurisée sera ajoutée ensuite.
       */

      if (username === "admin" && password === "PAUME2026") {
        window.location.href = "tableau%20de%20bord.html";
      } else {
        document.getElementById("message").style.display = "block";
      }

    });
  </script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.querySelector("form");

  if (!form) {
    console.error("Formulaire de connexion introuvable.");
    return;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const inputs = form.querySelectorAll("input");

    const username = inputs[0]?.value.trim();
    const password = inputs[1]?.value;

    if (!username || !password) {
      alert("Veuillez renseigner votre identifiant et votre mot de passe.");
      return;
    }

    const button = form.querySelector("button[type='submit']");

    if (button) {
      button.disabled = true;
      button.textContent = "Connexion...";
    }

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          password
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        alert(data.error || "Identifiants incorrects.");
        return;
      }

      // Stockage temporaire des informations non sensibles
      sessionStorage.setItem(
        "paume_admin_user",
        JSON.stringify(data.user)
      );

      // Accès au tableau de bord
      window.location.href = "tableau%20de%20bord.html";

    } catch (error) {
      console.error(error);
      alert("Impossible de contacter le serveur.");
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = "Se connecter";
      }
    }
  });
});
</script>
</body>
</html>
