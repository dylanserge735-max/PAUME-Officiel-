<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie | Administration PAUME</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0057a8;
      color: white;
      padding: 18px 20px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    header h1 {
      margin-top: 12px;
      font-size: 23px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .info {
      margin-bottom: 20px;
      padding: 14px;
      background: #eef6ff;
      border-radius: 9px;
      color: #24506f;
      font-size: 14px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
      background: #fafafa;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 14px 20px;
      background: #0057a8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #0057a8;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <a href="tableau%20de%20bord.html">← Tableau de bord</a>
  <h1>📸 Gestion de la galerie</h1>
</header>

<main>

  <div class="card">

    <div class="info">
      Ajoutez les photos et vidéos des activités de PAUME.
    </div>

    <form id="mediaForm">

      <div class="field">
        <label for="activity">Activité associée</label>

        <input
          type="text"
          id="activity"
          placeholder="Ex. Journée de salubrité à la Grande Gare"
          required
        >
      </div>

      <div class="field">
        <label for="type">Type de média</label>

        <select id="type" required>
          <option value="">Choisir</option>
          <option value="image">📸 Photo</option>
          <option value="video">🎥 Vidéo</option>
        </select>
      </div>

      <div class="field">
        <label for="media">Fichier</label>

        <input
          type="file"
          id="media"
          accept="image/*,video/*"
          required
        >
      </div>

      <div class="field">
        <label for="caption">Légende</label>

        <input
          type="text"
          id="caption"
          placeholder="Ex. Équipe PAUME lors de l'activité"
        >
      </div>

      <button type="submit">
        📤 Ajouter le média
      </button>

    </form>

    <a class="back" href="tableau%20de%20bord.html">
      ← Retour au tableau de bord
    </a>

  </div>

</main>

<script>
  document.getElementById("mediaForm").addEventListener("submit", function(e) {
    e.preventDefault();

    alert(
      "Le média est sélectionné. " +
      "L'envoi réel vers le stockage sera ajouté ensuite."
    );
  });
</script>

</body>
</html>
